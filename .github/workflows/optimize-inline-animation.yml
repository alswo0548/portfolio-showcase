name: Build optimized inline animations

on:
  push:
    branches:
      - perf/inline-animated-webp-20261105
    paths:
      - .github/workflows/optimize-inline-animation.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image encoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate and validate optimized looping animations
        run: python scripts/build_animated_previews.py
      - name: Commit optimized assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/01-octv/opt_*.webp assets/02-gooddeedquest/opt_*.webp assets/03-climbing-web/opt_*.webp
          git commit -m "perf: add optimized animated WebP previews"
          git push origin HEAD:perf/inline-animated-webp-20261105
