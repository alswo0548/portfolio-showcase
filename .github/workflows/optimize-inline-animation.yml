name: Build optimized inline animations

on:
  push:
    branches:
      - perf/inline-animated-webp-20261105
    paths:
      - .github/workflows/optimize-inline-animation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm encoder support
        run: |
          ffmpeg -hide_banner -encoders | grep -E 'libwebp_anim|libwebp'
      - name: Convert original demos to smaller animated WebP files
        shell: bash
        run: |
          set -euo pipefail
          encode() {
            local source="$1" out="$2" width="$3" fps="$4" quality="$5"
            echo "::group::$(basename "$out")"
            ffmpeg -hide_banner -nostdin -loglevel error -y -i "$source" \
              -vf "fps=$fps,scale='min($width,iw)':-2:flags=lanczos,format=yuva420p" \
              -an -c:v libwebp_anim -lossless 0 -q:v "$quality" -compression_level 6 -loop 0 "$out"
            test -s "$out"
            local frames
            frames=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 "$out" | head -1)
            test "$frames" -gt 1 || { echo "Failed animation validation: $source frames=$frames"; exit 1; }
            local src_size out_size
            src_size=$(stat -c '%s' "$source")
            out_size=$(stat -c '%s' "$out")
            echo "$source -> $out | $src_size -> $out_size bytes | $frames frames"
            test "$out_size" -lt "$src_size" || { echo "Not smaller than GIF"; exit 1; }
            echo "::endgroup::"
          }
          encode assets/01-octv/01_cctv_detection.gif assets/01-octv/opt_cctv_detection.webp 960 6 68
          encode assets/01-octv/02_incident_analysis.gif assets/01-octv/opt_incident_analysis.webp 960 6 68
          encode assets/01-octv/03_agency_routes.gif assets/01-octv/opt_agency_routes.webp 960 6 68
          encode assets/02-gooddeedquest/01_community_algorithm.gif assets/02-gooddeedquest/opt_community_algorithm.webp 380 8 73
          encode assets/02-gooddeedquest/02_team_challenge_llm.gif assets/02-gooddeedquest/opt_team_challenge_llm.webp 380 8 73
          encode assets/03-climbing-web/01_gym_map_search.gif assets/03-climbing-web/opt_gym_map_search.webp 900 6 70
          encode assets/03-climbing-web/02_gym_recommend.gif assets/03-climbing-web/opt_gym_recommend.webp 900 6 70
          encode assets/03-climbing-web/03_results_chart_players.gif assets/03-climbing-web/opt_results_chart_players.webp 900 6 70
          echo "Total optimized bytes:"
          stat -c '%s %n' assets/*/opt_*.webp
      - name: Commit optimized assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/01-octv/opt_*.webp assets/02-gooddeedquest/opt_*.webp assets/03-climbing-web/opt_*.webp
          git commit -m "perf: add optimized animated WebP previews"
          git push origin HEAD:perf/inline-animated-webp-20261105
